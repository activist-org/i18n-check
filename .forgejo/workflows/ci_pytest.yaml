name: ci_pytest
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  run_ci_pytest:
    name: Run CI Pytest
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Environment and Install Dependencies
        run: uv sync --frozen --all-groups

      - name: Run pytest - Unit Tests
        run: uv run pytest . --cov=src --cov-report=term-missing --cov-fail-under=85 --cov-config=./pyproject.toml -v
