name: ❓ Questions and everything else
description: We'd love to hear from you!
type: "task"
projects: ["activist-org/1"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I have searched [open and closed issues](https://codeberg.org/activist-org/i18n-check/issues?q=&type=all&sort=relevance&state=all)
          required: true
        - label: I agree to follow activist's [Code of Conduct](https://codeberg.org/activist-org/i18n-check/src/branch/main/.forgejo/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      placeholder: Ask a question, start a discussion, create an issue...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thank you for your contribution!
