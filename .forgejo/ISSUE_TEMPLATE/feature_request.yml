name: ✨ Feature request
description: Have a new idea or feature for i18n-check? Please suggest!
type: "feature"
projects: ["activist-org/1"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I have searched [open and closed feature requests](https://codeberg.org/activist-org/ts-backend-check/issues?q=&type=all&sort=relevance&labels=2281988&state=all)
          required: true
        - label: I agree to follow activist's [Code of Conduct](https://codeberg.org/activist-org/i18n-check/src/branch/main/.forgejo/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: A brief description of the enhancement you propose (with screenshots if applicable).
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution
      placeholder: Let us know if you'd like to help and how :)
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion!
