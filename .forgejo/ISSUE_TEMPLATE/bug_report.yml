name: 🐞 Bug report
description: Report a bug to help us improve i18n-check.
type: "bug"
projects: ["activist-org/1"]
body:
  - type: checkboxes
    id: new-bug
    attributes:
      label: Terms
      options:
        - label: I have searched all [open bug reports](https://codeberg.org/activist-org/ts-backend-check/issues?q=&type=all&sort=relevance&labels=2281973&state=open)
          required: true
        - label: I agree to follow activist's [Code of Conduct](https://codeberg.org/activist-org/i18n-check/src/branch/main/.forgejo/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    attributes:
      label: Behavior
      placeholder: |
        A concise description of what you're experiencing and what you expected to happen.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
